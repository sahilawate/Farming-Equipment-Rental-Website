<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background-color: #f5f6fa; color: #333; }

    /* Header */
    .profile-header { background: #006400; color: #fff; padding: 20px 0; text-align: center; position: relative; }
    .header-container { width: 90%; max-width: 1000px; margin: auto; display: flex; flex-direction: column; align-items: center; }
    .header-left { position: absolute; left: 20px; display: flex; align-items: center; }
    .header-left img { width: 50px; height: 50px; margin-right: 10px; }
    .header-left h1 { font-size: 24px; color: white; }
    .header-title { font-size: 28px; margin-bottom: 10px; }

    .profile-card {
      display: flex;
      align-items: center;
      padding: 20px;
      gap: 20px;
    }

    .user-avatar img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #ddd;
      object-fit: cover;
    }

    .user-details {
      font-size: 1.5rem;
      font-weight: bold;
      color: #333;
    }

    /* Profile Container */
    .profile-container { width: 90%; max-width: 1000px; margin: 20px auto; }
    .card { background-color: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 30px; margin-bottom: 30px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); width: 100%; max-width: 900px; margin-left: auto; margin-right: auto; }
    .card h3 { font-size: 1.4rem; margin-bottom: 18px; color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .info-list { list-style: none; margin-top: 10px; }
    .info-list li { margin-bottom: 10px; font-size: 0.9rem; }
    .info-label { font-weight: bold; color: #555; }

    /* Address Section */
    .address-group { display: flex; gap: 20px; margin-top: 10px; margin-bottom: 10px; }
    .address-group > div { flex: 1; }
    label { display: block; font-weight: bold; color: #555; margin-top: 10px; margin-bottom: 5px; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }

    /* Save Button */
    .save-changes button { padding: 10px 20px; background-color: #008000; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background 0.3s ease; }
    .save-changes button:hover { background-color: #006400; }

    /* Flash Message */
    .flash-message {
      display: none;
      padding: 10px;
      margin-top: 10px;
      background-color: #28a745;
      color: #fff;
      text-align: center;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <header class="profile-header">
    <div class="header-left">
      <a href="{{ url_for('home.index') }}">
      <img src="{{ url_for('static', filename='img/GTlogo.png') }}" alt="Krishi Kaushal Logo">
      </a>
      <h1>Krishi Kaushal</h1>
    </div>
    <div class="header-container">
      <h1 class="header-title">My Profile</h1>
    </div>
  </header>
  
  <div class="profile-container">
    <div class="card profile-card">
      <div class="user-avatar">
        <img src="{{ url_for('static', filename='img/profile.jpg') }}" alt="Profile Photo">
      </div>
      <div class="user-details">
        {{ user.fullname }}
      </div>
    </div>

    <div class="main-content">
      <div class="card">
        <h3>Personal Information</h3>
        <ul class="info-list">
          <li><span class="info-label">Full Name:</span> {{ user.fullname }}</li>
          <li><span class="info-label">Email:</span> {{ user.email }}</li>
          <li><span class="info-label">Phone:</span> {{ user.phone }}</li>
        </ul>
      </div>

      <!-- Address Form -->
      <div class="card">
        <h3>Address Details</h3>
        <form id="updateAddressForm">
          <label for="street">Street Address:</label>
          <input type="text" id="street" name="street_address" placeholder="Enter your street address" 
                 value="{{ address.street_address if address else '' }}">

          <div class="address-group">
            <div>
              <label for="landmark">Landmark:</label>
              <input type="text" id="landmark" name="landmark" placeholder="E.g., Near Market or Post Office" 
                     value="{{ address.landmark if address else '' }}">
            </div>
            <div>
              <label for="village">Village/Locality:</label>
              <input type="text" id="village" name="village_locality" placeholder="Enter your village/locality" 
                     value="{{ address.village_locality if address else '' }}">
            </div>
          </div>

          <div class="address-group">
            <div>
              <label for="pincode">Pin Code:</label>
              <input type="text" id="pincode" name="pin_code" placeholder="Enter your pin code" 
                     value="{{ address.pin_code if address else '' }}">
            </div>
            <div>
              <label for="city">City:</label>
              <input type="text" id="city" name="city" placeholder="Enter your city" 
                     value="{{ address.city if address else '' }}">
            </div>
          </div>

          <label for="state">State:</label>
          <input type="text" id="state" name="state" placeholder="Enter your state" 
                 value="{{ address.state if address else '' }}">

          <div class="save-changes">
            <button type="button" id="saveAddress">Save Changes</button>
          </div>

        </form>

        <!-- Flash Message -->
        <div id="flashMessage" class="flash-message"></div>

      </div>
    </div>
  </div>

  <script>
    fetch('/auth/update_address', {  // Add 'auth' in the URL
    method: 'POST',
    headers: {
        'Content-Type': 'application/json'
    },
    body: JSON.stringify({
        street_address: document.getElementById("street_address").value,
        landmark: document.getElementById("landmark").value,
        village_locality: document.getElementById("village_locality").value,
        pin_code: document.getElementById("pin_code").value,
        city: document.getElementById("city").value,
        state: document.getElementById("state").value
    })
})
.then(response => response.json())
.then(data => {
    console.log("Server Response:", data);
    alert(data.message);  // Show success or error message
})
.catch(error => console.error("Fetch error:", error));


    </script>    

</body>
</html>
